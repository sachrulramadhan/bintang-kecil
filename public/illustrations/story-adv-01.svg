  <polygon points="350,130 320,190 380,190" fill="#06B6D4"/>
  <!-- Ground -->
  <rect x="0" y="240" width="400" height="60" fill="#15803D"/>
  <circle cx="200" cy="210" r="22" fill="#FDE047"/>
  <text x="200" y="217" font-size="20" text-anchor="middle">✨</text>
